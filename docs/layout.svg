  <text x="20" y="37" fill="#7096D1" font-size="10" font-family="sans-serif">侧栏展开 = 挤压中栏</text>
  <text x="300" y="22" fill="#D0E3FF" font-size="12" font-family="sans-serif" font-weight="bold">改造后</text>
  <text x="300" y="37" fill="#7096D1" font-size="10" font-family="sans-serif">侧栏 = 浮层，中栏保持全宽</text>

