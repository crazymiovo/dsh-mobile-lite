<svg xmlns="http://www.w3.org/2000/svg" width="560" height="342" viewBox="0 0 560 342" role="img" aria-label="DSH 移动端布局对比：改造前侧栏挤压中栏，改造后侧栏成浮层、中栏保持全宽">
